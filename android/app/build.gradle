plugins {
    id 'com.android.application'
}

android {
    namespace 'org.duckdns.myappsserver.esputi'
    compileSdk 35

    defaultConfig {
        applicationId 'org.duckdns.myappsserver.esputi'
        minSdk 26
        // 34 y no 35: así el sistema no dibuja la web por debajo de la barra de estado
        targetSdk 34
        versionCode 3
        versionName '1.2'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint {
        abortOnError false
    }
}
