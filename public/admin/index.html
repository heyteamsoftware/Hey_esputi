<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Administración · Esputi</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/svg+xml" href="/esputi/favicon.svg">
<link rel="stylesheet" href="/esputi/legal.css">
<link rel="stylesheet" href="/esputi/admin/admin.css">
</head>
<body>
<main>
  <header class="top">
    <img src="/esputi/favicon.svg" alt="Logotipo de Esputi" width="40" height="40">
    <h1>Administración de Esputi</h1>
  </header>

  <form id="login" hidden novalidate>
    <label for="pw">Contraseña de administración</label>
    <input id="pw" type="password" autocomplete="current-password" required maxlength="100">
    <p id="login-err" class="err" role="alert"></p>
    <button class="btn" type="submit">Entrar</button>
  </form>

  <section id="panel" hidden>
    <div class="bar">
      <p id="summary"></p>
      <div>
        <button id="reload" class="ghost" type="button">Actualizar</button>
        <button id="logout" class="ghost" type="button">Cerrar sesión</button>
      </div>
    </div>
    <input id="filter" type="search" placeholder="Filtrar por nombre" aria-label="Filtrar usuarios por nombre" maxlength="40">
    <p id="panel-err" class="err" role="alert"></p>
    <div class="table-wrap">
      <table>
        <thead><tr><th>Usuario</th><th>Registro</th><th>Favoritos</th><th>Playlists</th><th>Spotify</th><th>Última actividad</th><th><span class="sr">Acciones</span></th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <p id="none" hidden>No hay usuarios.</p>
  </section>

  <p><a href="/esputi/">← Volver a Esputi</a></p>
</main>
<script src="/esputi/admin/admin.js"></script>
</body>
</html>
